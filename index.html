<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mission Days</title>
  <meta name="description" content="Set a goal, count down the days, and log each day's tasks, feedback and learnings. Free, private, works offline.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <!-- Home-screen app on iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mission Days">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Pick the saved look before the page paints (full logic lives in app.js).
    try {
      var saved = (JSON.parse(localStorage.getItem("gate-air100:v1") || "{}").theme) || "mono";
      var look = new URLSearchParams(location.search).get("theme") || saved;
      if (look === "auto") look = matchMedia("(prefers-color-scheme: dark)").matches ? "mono" : "sunrise";
      document.documentElement.dataset.theme = look === "sunrise" ? "sunrise" : "mono";
    } catch (e) { document.documentElement.dataset.theme = "mono"; }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <!-- Shared gradient for rings and icons -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-accent" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" style="stop-color:var(--sage)"/>
        <stop offset="1" style="stop-color:var(--lavender)"/>
      </linearGradient>
    </defs>
  </svg>

  <main id="app"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
